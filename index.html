<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <div class="calculator-header">
            <div>
                <h1>Scientific Calculator</h1>
            </div>

            <button id="mode-btn" class="mode-btn">DEG</button>
        </div>

        <div class="display">
            <div id="previous-display"></div>
            <div id="current-display">0</div>
        </div>

        <div class="buttons">

            <!-- Scientific Functions -->
            <button class="scientific" data-action="function" data-function="sin">sin</button>
            <button class="scientific" data-action="function" data-function="cos">cos</button>
            <button class="scientific" data-action="function" data-function="tan">tan</button>
            <button class="scientific" data-action="function" data-function="sqrt">√</button>
            <button class="scientific" data-action="function" data-function="square">x²</button>

            <button class="scientific" data-action="function" data-function="log">log</button>
            <button class="scientific" data-action="function" data-function="ln">ln</button>
            <button class="scientific" data-action="function" data-function="pi">π</button>
            <button class="scientific" data-action="function" data-function="e">e</button>
            <button class="scientific" data-action="function" data-function="percent">%</button>

            <!-- Calculator Buttons -->
            <button class="function" data-action="clear">AC</button>
            <button class="function" data-action="delete">DEL</button>
            <button class="operator" data-action="operator">(</button>
            <button class="operator" data-action="operator">)</button>
            <button class="operator" data-action="operator">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-action="operator">×</button>
            <button class="operator" data-action="operator">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-action="operator">+</button>
            <button class="operator" data-action="power">xʸ</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equals" data-action="equals">=</button>
            <button class="scientific" data-action="function" data-function="factorial">x!</button>

            <button class="zero" data-number="0">0</button>
            <button data-number=".">.</button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
